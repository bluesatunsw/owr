[package]
authors = ["Aavin Fernando <aavin.fernando@gmail.com>"]
edition = "2024"
readme = "README.md"
name = "cpm_bringup"
version = "0.0.1"

# allows use of `cargo fix`
[[bin]]
name = "cpm_bringup"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.1"
defmt-rtt = "1.0"
heapless = "0.9.3"
stm32g4xx-hal = { git = "https://github.com/bluesatunsw/stm32g4xx-hal", version = "0.0.3", features = ["stm32g474", "rt", "can"] }
embedded-common = { git = "https://github.com/bluesatunsw/embedded_common" }
embedded-alloc = "0.7.0"
panic-probe = { version = "1.0", features = ["defmt"] }
libm = "0.2.16"

# cargo build/run
[profile.dev]
# default is opt-level = '0', but that makes very
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# default is opt-level = '3', but that makes quite
# verbose machine code
opt-level = 'z'
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across
# crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
# (this doesn't increase size on flash)
debug = 2
